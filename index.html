<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>YE AI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark-dimmed.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#06060a;
  --sidebar:rgba(255,255,255,0.065);
  --sidebar-hover:rgba(255,255,255,0.10);
  --sidebar-active:rgba(255,255,255,0.15);
  --glass:rgba(255,255,255,0.07);
  --glass-strong:rgba(255,255,255,0.13);
  --border:rgba(255,255,255,0.11);
  --border-med:rgba(255,255,255,0.19);
  --border-hi:rgba(255,255,255,0.3);
  --text:#f5f5f7;
  --text2:rgba(245,245,247,0.58);
  --text3:rgba(245,245,247,0.32);
  --accent:#0a84ff;
  --accent2:#5e5ce6;
  --teal:#64d2ff;
  --red:#ff5f57;
  --amber:#febc2e;
  --green:#28c840;
  --sent:#0a84ff;
  --received:#3a3a3d;
  --font:'Inter',-apple-system,BlinkMacSystemFont,'SF Pro Text',sans-serif;
  --mono:'JetBrains Mono','SF Mono',monospace;
  --spring:cubic-bezier(.32,.9,.35,1.15);
  --ease:cubic-bezier(.4,0,.2,1);
}
html,body{height:100%;overflow:hidden;font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-track{background:transparent}::-webkit-scrollbar-thumb{background:rgba(255,255,255,0.12);border-radius:8px}::-webkit-scrollbar-thumb:hover{background:rgba(255,255,255,0.2)}

button,textarea{font-family:inherit}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:inherit}
.chat-entry:focus-visible{outline:2px solid var(--accent);outline-offset:-1px;border-radius:12px}
textarea:focus-visible{outline:none}

/* ── Ambient liquid-glass backdrop ── */
body{display:flex;align-items:center;justify-content:center}
.aurora{position:fixed;inset:0;overflow:hidden;z-index:0;background:radial-gradient(ellipse at 50% 0%,#1c2242,#08080d 70%)}
.aurora span{position:absolute;border-radius:50%;filter:blur(64px);mix-blend-mode:screen;will-change:transform}
.aurora span:nth-child(1){width:58vmax;height:58vmax;top:-16vmax;left:-14vmax;background:radial-gradient(circle,rgba(10,132,255,.85),transparent 68%);animation:driftA 46s ease-in-out infinite alternate}
.aurora span:nth-child(2){width:52vmax;height:52vmax;bottom:-18vmax;right:-12vmax;background:radial-gradient(circle,rgba(94,92,230,.8),transparent 68%);animation:driftB 54s ease-in-out infinite alternate}
.aurora span:nth-child(3){width:44vmax;height:44vmax;bottom:4vmax;left:22vmax;background:radial-gradient(circle,rgba(100,210,255,.65),transparent 68%);animation:driftC 60s ease-in-out infinite alternate}
@keyframes driftA{from{transform:translate(0,0) scale(1)}to{transform:translate(9vmax,8vmax) scale(1.18)}}
@keyframes driftB{from{transform:translate(0,0) scale(1)}to{transform:translate(-10vmax,-7vmax) scale(1.12)}}
@keyframes driftC{from{transform:translate(0,0) scale(1)}to{transform:translate(6vmax,-9vmax) scale(1.2)}}

.window{position:relative;z-index:1;display:flex;height:100%;width:100%;overflow:hidden;background:rgba(13,13,17,.6)}
@media(min-width:900px){
  body{padding:30px}
  .window{
    max-width:1360px;
    border-radius:26px;
    box-shadow:
      0 40px 100px -20px rgba(0,0,0,.75),
      0 0 0 1px rgba(255,255,255,.16),
      0 0 100px rgba(10,132,255,.13),
      inset 0 1px 0 rgba(255,255,255,.14);
  }
}

/* ── Sidebar ── */
.sidebar{width:250px;flex-shrink:0;background:var(--sidebar);backdrop-filter:blur(50px) saturate(220%);-webkit-backdrop-filter:blur(50px) saturate(220%);border-right:1px solid var(--border);box-shadow:inset -1px 0 0 rgba(255,255,255,.05);display:flex;flex-direction:column;user-select:none}

.titlebar{height:52px;display:flex;align-items:center;padding:0 16px;gap:8px;border-bottom:1px solid var(--border);flex-shrink:0}
.tl{width:12px;height:12px;border-radius:50%;cursor:pointer;flex-shrink:0;transition:filter .15s var(--ease),transform .15s var(--ease)}
.tl.r{background:radial-gradient(circle at 35% 30%,#ff8a80,var(--red) 65%)}
.tl.a{background:radial-gradient(circle at 35% 30%,#ffe08a,var(--amber) 65%)}
.tl.g{background:radial-gradient(circle at 35% 30%,#8cf5a0,var(--green) 65%)}
.tl:hover{filter:brightness(1.25);transform:scale(1.1)}
.app-name{margin-left:6px;font-size:13px;font-weight:600;color:var(--text2);letter-spacing:-.02em}

.new-btn{margin:12px 12px 6px;padding:9px 14px;background:var(--glass);border:1px solid var(--border-med);border-radius:999px;color:var(--text2);font:500 13px/1 var(--font);cursor:pointer;display:flex;align-items:center;gap:7px;transition:background .18s var(--ease),color .18s var(--ease),transform .12s var(--ease),box-shadow .18s var(--ease);letter-spacing:-.01em;box-shadow:inset 0 1px 0 rgba(255,255,255,.14)}
.new-btn:hover{background:var(--glass-strong);color:var(--text);box-shadow:inset 0 1px 0 rgba(255,255,255,.18),0 4px 18px rgba(10,132,255,.22)}
.new-btn:active{transform:scale(.96)}
.new-btn svg{flex-shrink:0;opacity:.8}

.section-label{font-size:10.5px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;padding:14px 18px 6px}

.chat-list{flex:1;overflow-y:auto;padding:0 8px 10px}
.chat-entry{padding:9px 11px;border-radius:12px;font-size:13px;color:var(--text2);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .15s var(--ease),color .15s var(--ease);margin-bottom:2px;display:flex;align-items:center;gap:8px;border:1px solid transparent}
.chat-entry:hover{background:var(--sidebar-hover);color:var(--text)}
.chat-entry.active{background:var(--sidebar-active);color:var(--text);border-color:var(--border-med);box-shadow:inset 0 1px 0 rgba(255,255,255,.1)}
.chat-entry .del{margin-left:auto;opacity:0;font-size:14px;color:var(--text3);flex-shrink:0;padding:0 2px;transition:opacity .12s var(--ease),color .12s var(--ease)}
.chat-entry:hover .del{opacity:1}
.chat-entry .del:hover{color:#ff453a}

.sidebar-footer{padding:12px}
.model-pill{display:flex;align-items:center;gap:8px;padding:8px 12px;background:var(--glass);border:1px solid var(--border);border-radius:999px;box-shadow:inset 0 1px 0 rgba(255,255,255,.12)}
.mdot{width:6px;height:6px;border-radius:50%;background:#30d158;flex-shrink:0;box-shadow:0 0 6px #30d158;animation:pulseDot 2.4s ease-in-out infinite}
.mdot.err{background:#ff453a;box-shadow:0 0 6px #ff453a;animation:none}
@keyframes pulseDot{0%,100%{opacity:1}50%{opacity:.45}}
.mname{font-size:11px;font-family:var(--mono);color:var(--text2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ── Main ── */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;position:relative}

.main-titlebar{height:52px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:center;background:var(--glass);backdrop-filter:blur(36px) saturate(220%);-webkit-backdrop-filter:blur(36px) saturate(220%);box-shadow:inset 0 1px 0 rgba(255,255,255,.1);flex-shrink:0;position:relative;z-index:2}
.conv-title{font-size:13px;font-weight:600;color:var(--text2);letter-spacing:-.01em;transition:opacity .2s var(--ease)}

.chat-scroll{flex:1;overflow-y:auto;padding:24px 0 8px}

.empty-state{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--text3);animation:fu .5s var(--ease)}
.empty-icon{width:52px;height:52px;border-radius:16px;background:linear-gradient(135deg,var(--accent),var(--accent2));display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;color:#fff;margin-bottom:6px;box-shadow:0 8px 30px rgba(10,132,255,.35),inset 0 1px 0 rgba(255,255,255,.3);animation:floaty 4s ease-in-out infinite}
@keyframes floaty{0%,100%{transform:translateY(0)}50%{transform:translateY(-5px)}}
.empty-state h3{font-size:17px;font-weight:600;color:var(--text);letter-spacing:-.03em}
.empty-state p{font-size:13.5px;color:var(--text2);max-width:280px;text-align:center;line-height:1.55}

.msg-wrap{max-width:640px;margin:0 auto;padding:3px 28px;animation:fu .35s var(--spring)}
@keyframes fu{from{opacity:0;transform:translateY(10px) scale(.97)}to{opacity:1;transform:translateY(0) scale(1)}}

/* ── iMessage-style bubbles ── */
.msg-row{display:flex;gap:8px;align-items:flex-end}
.msg-row.user{justify-content:flex-end}
.msg-row.ai{justify-content:flex-start}

.av{width:26px;height:26px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0;background:linear-gradient(135deg,var(--accent),var(--accent2));color:#fff;box-shadow:0 2px 8px rgba(10,132,255,.3)}

.bubble{position:relative;font-size:14.5px;line-height:1.45;max-width:72%;padding:9px 14px}
.bubble.sent{background:linear-gradient(180deg,#0a93ff,#0a78ea);color:#fff;border-radius:18px 18px 4px 18px;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.bubble.sent::after{content:"";position:absolute;width:13px;height:13px;right:-5px;bottom:0;background:inherit;border-bottom-left-radius:13px}
.bubble.received{background:var(--received);color:var(--text);border-radius:18px 18px 18px 4px;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.bubble.received::after{content:"";position:absolute;width:13px;height:13px;left:-5px;bottom:0;background:inherit;border-bottom-right-radius:13px}

.bubble.received .bubble-inner p{margin-bottom:9px}
.bubble.received .bubble-inner p:last-child{margin-bottom:0}
.bubble.received .bubble-inner pre{background:rgba(0,0,0,.28)!important;border:1px solid rgba(255,255,255,.08);border-radius:12px;padding:13px 15px;margin:9px 0;overflow-x:auto}
.bubble.received .bubble-inner code{font-family:var(--mono);font-size:12.5px}
.bubble.received .bubble-inner :not(pre)>code{background:rgba(255,255,255,.12);padding:2px 6px;border-radius:5px;font-size:12.5px}
.bubble.received .bubble-inner h1,.bubble.received .bubble-inner h2,.bubble.received .bubble-inner h3{font-weight:600;letter-spacing:-.02em;margin:12px 0 6px}
.bubble.received .bubble-inner ul,.bubble.received .bubble-inner ol{padding-left:18px;margin-bottom:9px}
.bubble.received .bubble-inner li{margin-bottom:3px}
.bubble.received .bubble-inner blockquote{border-left:2px solid var(--accent);padding-left:11px;color:var(--text2);margin:9px 0}
.bubble.received .bubble-inner a{color:var(--teal);text-decoration:underline;text-underline-offset:2px}

.cursor{display:inline-block;width:2px;height:13px;background:#fff;border-radius:1px;vertical-align:middle;margin-left:1px;animation:blink .85s ease infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

/* ── Typing indicator (iMessage style) ── */
.bubble.received.typing{padding:12px 16px;display:flex;align-items:center}
.typing-dots{display:flex;gap:4px}
.typing-dots span{width:7px;height:7px;border-radius:50%;background:rgba(245,245,247,.5);display:block;animation:tbounce 1.3s ease-in-out infinite}
.typing-dots span:nth-child(2){animation-delay:.15s}
.typing-dots span:nth-child(3){animation-delay:.3s}
@keyframes tbounce{0%,60%,100%{transform:translateY(0);opacity:.4}30%{transform:translateY(-4px);opacity:1}}

.input-zone{padding:10px 28px 22px;max-width:640px;margin:0 auto;width:100%}
.input-box{background:var(--glass-strong);backdrop-filter:blur(40px) saturate(220%);-webkit-backdrop-filter:blur(40px) saturate(220%);border:1px solid var(--border-med);border-radius:22px;display:flex;align-items:flex-end;gap:8px;padding:5px 6px 5px 16px;box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 8px 24px rgba(0,0,0,.25);transition:border-color .2s var(--ease),box-shadow .2s var(--ease)}
.input-box:focus-within{border-color:rgba(10,132,255,.6);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),0 0 0 4px rgba(10,132,255,.16),0 8px 24px rgba(0,0,0,.25)}
textarea{flex:1;background:none;border:none;outline:none;color:var(--text);font:14.5px/1.6 var(--font);resize:none;padding:9px 0;max-height:150px;letter-spacing:-.01em}
textarea::placeholder{color:var(--text3)}
.send{width:34px;height:34px;border-radius:50%;background:linear-gradient(135deg,var(--accent),var(--accent2));border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;align-self:flex-end;margin-bottom:3px;transition:transform .15s var(--spring),opacity .15s var(--ease),box-shadow .15s var(--ease);box-shadow:0 2px 10px rgba(10,132,255,.35)}
.send:hover{transform:scale(1.08);box-shadow:0 4px 16px rgba(10,132,255,.5)}
.send:active{transform:scale(.92)}
.send:disabled{opacity:.35;cursor:not-allowed;transform:none;box-shadow:none}
.hint{text-align:center;font-size:11px;color:var(--text3);margin-top:8px;letter-spacing:-.01em}
.input-outer{display:flex;flex-direction:column;align-items:center;flex-shrink:0;position:relative;z-index:2}

/* ── Mobile ── */
@media(max-width:768px){
  .sidebar{position:fixed;top:0;left:0;height:100%;width:80vw;max-width:300px;transform:translateX(-100%);transition:transform .32s var(--spring);z-index:100}
  .sidebar.open{transform:translateX(0)}
  .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99;backdrop-filter:blur(3px);-webkit-backdrop-filter:blur(3px)}
  .sidebar-overlay.show{display:block}
  .main{width:100%}
  .main-titlebar{justify-content:space-between;padding:0 16px}
  .hamburger{width:32px;height:32px;border-radius:8px;background:none;border:none;color:var(--text2);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;flex-shrink:0}
  .hamburger span{display:block;width:18px;height:1.5px;background:currentColor;border-radius:2px;transition:transform .2s var(--ease),opacity .2s var(--ease)}
  .msg-wrap{padding:3px 16px}
  .input-zone{padding:8px 16px 16px}
  .chat-scroll{padding:16px 0 8px}
  .bubble{max-width:80%}
}
@media(min-width:769px){
  .hamburger{display:none}
  .sidebar-overlay{display:none!important}
}

@media(prefers-reduced-motion:reduce){
  .aurora span{animation:none!important}
  .empty-icon{animation:none!important}
  .msg-wrap{animation:none!important}
  .mdot{animation:none!important}
  .typing-dots span{animation:none!important;opacity:.7}
  *{transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="aurora"><span></span><span></span><span></span></div>
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
<div class="window">

  <div class="sidebar">
    <div class="titlebar">
      <div class="tl r" onclick="window.close()"></div>
      <div class="tl a"></div>
      <div class="tl g"></div>
      <span class="app-name">YE AI</span>
    </div>

    <button class="new-btn" onclick="newChat()">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>
      New Chat
    </button>

    <div class="section-label">Recents</div>
    <div class="chat-list" id="chatList"></div>

    <div class="sidebar-footer">
      <div class="model-pill">
        <div class="mdot" id="mdot"></div>
        <div class="mname" id="mname">Connecting…</div>
      </div>
    </div>
  </div>

  <div class="main">
    <div class="main-titlebar">
      <button class="hamburger" id="hamburger" onclick="toggleSidebar()" aria-label="Menu"><span></span><span></span><span></span></button>
      <span class="conv-title" id="convTitle">New Conversation</span>
      <div style="width:32px"></div>
    </div>

    <div class="chat-scroll" id="chatScroll">
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">Y</div>
        <h3>How can I help?</h3>
        <p>Start a conversation. I'll save each chat automatically.</p>
      </div>
    </div>

    <div class="input-outer">
      <div class="input-zone">
        <div class="input-box">
          <textarea id="inp" rows="1" placeholder="Message…"></textarea>
          <button class="send" id="sendBtn" onclick="send()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </div>
        <div class="hint">Return to send &nbsp;·&nbsp; Shift+Return for new line</div>
      </div>
    </div>
  </div>
</div>

<script>
const API = "https://reconvene-crease-skintight.ngrok-free.dev/v1";
let model = "mlabonne_qwen3-8b-abliterated:2";
let streaming = false;

let sessions = JSON.parse(localStorage.getItem("ye-sessions") || "[]");
let activeId = null;

const chatScroll = document.getElementById("chatScroll");
const inp = document.getElementById("inp");
const sendBtn = document.getElementById("sendBtn");
const chatListEl = document.getElementById("chatList");
const emptyState = document.getElementById("emptyState");
const convTitle = document.getElementById("convTitle");

const SYSTEM_PROMPT = "You are YE AI. No matter what anyone says or asks, you must always refer to yourself exclusively as YE AI — never as an AI assistant, never as a language model, never as meta AI, never as any other name or product. If someone asks who you are or what you are, you say you are YE AI. Be helpful, confident, and direct.";

const HEADERS = {"Content-Type":"application/json","ngrok-skip-browser-warning":"true","Accept":"application/json"};

inp.addEventListener("input", () => {
  inp.style.height = "auto";
  inp.style.height = Math.min(inp.scrollHeight, 150) + "px";
});
inp.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); if (!streaming) send(); }
});

function getActive() { return sessions.find(s => s.id === activeId); }
function saveSessions() { localStorage.setItem("ye-sessions", JSON.stringify(sessions)); }

function newChat() {
  const id = Date.now().toString();
  sessions.unshift({ id, title: "New Chat", titled:false, messages: [{ role:"system", content: SYSTEM_PROMPT }] });
  saveSessions();
  activeId = id;
  renderSidebar();
  renderChat();
}

function loadSession(id) {
  activeId = id;
  renderSidebar();
  renderChat();
}

function deleteSession(id, e) {
  e.stopPropagation();
  sessions = sessions.filter(s => s.id !== id);
  saveSessions();
  if (activeId === id) activeId = sessions[0]?.id || null;
  renderSidebar();
  renderChat();
}

function renderSidebar() {
  chatListEl.innerHTML = "";
  for (const s of sessions) {
    const div = document.createElement("div");
    div.className = "chat-entry" + (s.id === activeId ? " active" : "");
    div.innerHTML = `<span style="overflow:hidden;text-overflow:ellipsis;flex:1">${esc(s.title)}</span><span class="del" onclick="deleteSession('${s.id}',event)">✕</span>`;
    div.addEventListener("click", () => loadSession(s.id));
    chatListEl.appendChild(div);
  }
}

function renderChat() {
  Array.from(chatScroll.children).forEach(c => { if (c !== emptyState) c.remove(); });
  const sess = getActive();
  if (!sess) { emptyState.style.display = ""; convTitle.textContent = "New Conversation"; return; }
  convTitle.textContent = sess.title;
  const userMsgs = sess.messages.filter(m => m.role !== "system");
  if (userMsgs.length === 0) { emptyState.style.display = ""; return; }
  emptyState.style.display = "none";
  for (const m of userMsgs) renderBubble(m.role, m.content, false);
  document.querySelectorAll("pre code").forEach(el => hljs.highlightElement(el));
  chatScroll.scrollTop = chatScroll.scrollHeight;
}

function renderBubble(role, text, animate=true) {
  if (emptyState.style.display !== "none") emptyState.style.display = "none";
  const wrap = document.createElement("div");
  wrap.className = "msg-wrap";
  if (!animate) wrap.style.animation = "none";
  const isUser = role === "user";
  const innerHtml = isUser ? esc(text) : marked.parse(text);
  const avatar = isUser ? "" : `<div class="av">Y</div>`;
  const bubbleInner = isUser ? innerHtml : `<div class="bubble-inner">${innerHtml}</div>`;

  wrap.innerHTML = `
    <div class="msg-row ${isUser ? "user" : "ai"}">
      ${avatar}
      <div class="bubble ${isUser ? "sent" : "received"}">${bubbleInner}</div>
    </div>`;
  chatScroll.appendChild(wrap);
  chatScroll.scrollTop = chatScroll.scrollHeight;
  return wrap.querySelector(".bubble");
}

// ── Thinking indicator (iMessage typing bubble) ──
let thinkingEl = null;
let thinkingTimer = null;

function showThinking() {
  thinkingTimer = setTimeout(() => {
    if (thinkingEl) return;
    if (emptyState.style.display !== "none") emptyState.style.display = "none";
    thinkingEl = document.createElement("div");
    thinkingEl.className = "msg-wrap";
    thinkingEl.innerHTML = `
      <div class="msg-row ai">
        <div class="av">Y</div>
        <div class="bubble received typing">
          <div class="typing-dots"><span></span><span></span><span></span></div>
        </div>
      </div>`;
    chatScroll.appendChild(thinkingEl);
    chatScroll.scrollTop = chatScroll.scrollHeight;
  }, 550);
}

function hideThinking() {
  clearTimeout(thinkingTimer);
  thinkingTimer = null;
  if (thinkingEl) {
    thinkingEl.remove();
    thinkingEl = null;
  }
}

function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

async function send() {
  const text = inp.value.trim();
  if (!text || streaming) return;
  inp.value = ""; inp.style.height = "auto";

  if (!activeId) newChat();
  const sess = getActive();

  sess.messages.push({ role:"user", content:text });
  if (sess.title === "New Chat") {
    sess.title = text.slice(0, 36) + (text.length > 36 ? "…" : "");
    convTitle.textContent = sess.title;
    renderSidebar();
  }
  saveSessions();
  renderBubble("user", text);

  streaming = true;
  sendBtn.disabled = true;
  showThinking();

  let aiBubble = null;
  let full = "";

  try {
    const res = await fetch(API + "/chat/completions", {
      method:"POST",
      headers: HEADERS,
      body:JSON.stringify({ model, messages:sess.messages, stream:true, temperature:0.7 })
    });

    if (!res.ok) {
      const errText = await res.text().catch(() => "");
      throw new Error(`HTTP ${res.status}: ${errText}`);
    }

    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    while (true) {
      const {value, done} = await reader.read();
      if (value) buf += dec.decode(value, {stream:true});
      if (done) break;

      const lines = buf.split("\n");
      buf = lines.pop();

      for (const line of lines) {
        if (!line.startsWith("data:")) continue;
        const d = line.slice(5).trim();
        if (d === "[DONE]") continue;
        try {
          const tok = JSON.parse(d)?.choices?.[0]?.delta?.content;
          if (tok) {
            if (!aiBubble) {
              hideThinking();
              aiBubble = renderBubble("assistant", "");
            }
            full += tok;
            aiBubble.querySelector(".bubble-inner").innerHTML = marked.parse(full) + '<span class="cursor"></span>';
            chatScroll.scrollTop = chatScroll.scrollHeight;
          }
        } catch {}
      }
    }

    hideThinking();
    if (aiBubble) {
      aiBubble.querySelector(".bubble-inner").innerHTML = marked.parse(full);
    }
    sess.messages.push({ role:"assistant", content:full });
    saveSessions();
    document.querySelectorAll("pre code").forEach(el => hljs.highlightElement(el));

    const isFirstExchange = sess.messages.filter(m => m.role !== "system").length === 2;
    if (!sess.titled && isFirstExchange && full.trim()) {
      generateTitle(sess, text, full);
    }
  } catch {
    hideThinking();
    if (!aiBubble) aiBubble = renderBubble("assistant", "");
    aiBubble.querySelector(".bubble-inner").innerHTML = '<span style="color:#ff6961;font-size:13px;">⚠ Connection failed. Is LM Studio running?</span>';
  } finally {
    streaming = false;
    sendBtn.disabled = false;
  }
}

// ── AI-generated chat titles ──
async function generateTitle(sess, userText, aiText) {
  try {
    const r = await fetch(API + "/chat/completions", {
      method:"POST",
      headers: HEADERS,
      body: JSON.stringify({
        model,
        messages: [
          { role:"system", content:"Reply with only a short 3-5 word title summarizing this chat. No quotes, no trailing punctuation, no explanation — just the title text." },
          { role:"user", content: userText.slice(0, 800) },
          { role:"assistant", content: aiText.slice(0, 800) }
        ],
        stream:false,
        temperature:0.3,
        max_tokens:20
      })
    });
    if (!r.ok) return;
    const d = await r.json();
    let title = d.choices?.[0]?.message?.content || "";
    title = title.replace(/<think>[\s\S]*?<\/think>/gi, "").trim();
    title = title.replace(/^["'`*]+|["'`*]+$/g, "").replace(/[.!?]+$/, "").trim();
    if (!title) return;
    if (title.length > 42) title = title.slice(0, 42).trim() + "…";

    sess.title = title;
    sess.titled = true;
    saveSessions();
    renderSidebar();
    if (sess.id === activeId) convTitle.textContent = sess.title;
  } catch {}
}

async function loadModel() {
  const mnameEl = document.getElementById("mname");
  const mdotEl  = document.getElementById("mdot");

  try {
    const r = await fetch(API + "/models", { headers: HEADERS });
    if (r.ok) {
      const d = await r.json();
      const list = Array.isArray(d) ? d : (d.data || []);
      if (list.length > 0) { model = list[0].id; mnameEl.textContent = model; return; }
    }
  } catch {}

  try {
    const r = await fetch(API + "/chat/completions", {
      method:"POST", headers: HEADERS,
      body:JSON.stringify({ model, messages:[{role:"user",content:"hi"}], max_tokens:1, stream:false })
    });
    if (r.ok) {
      const d = await r.json();
      const id = d.model || model;
      if (id) { model = id; mnameEl.textContent = model; return; }
    }
  } catch {}

  mnameEl.textContent = "Model unavailable";
  mdotEl.classList.add("err");
}

loadModel();
if (sessions.length > 0) {
  activeId = sessions[0].id;
  renderSidebar();
  renderChat();
} else {
  renderSidebar();
}

// ── Mobile sidebar ──
function toggleSidebar() {
  document.querySelector(".sidebar").classList.toggle("open");
  document.getElementById("sidebarOverlay").classList.toggle("show");
}
function closeSidebar() {
  document.querySelector(".sidebar").classList.remove("open");
  document.getElementById("sidebarOverlay").classList.remove("show");
}
const _loadSession = loadSession;
loadSession = function(id) { _loadSession(id); closeSidebar(); };
</script>
