html[data-theme="onyx"]{

html,body{height:100%;overflow:hidden;font-family:var(--font);background:var(--bg);color:var(--text);-webkit-font-smoothing:antialiased}

.window{display:flex;height:100vh;overflow:hidden}

.sidebar{width:240px;flex-shrink:0;background:var(--sidebar);border-right:1px solid var(--border);display:flex;flex-direction:column;user-select:none}

.chat-entry{padding:8px 10px;border-radius:7px;font-size:13px;color:var(--text2);cursor:pointer;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:background .1s,color .1s;margin-bottom:1px;display:flex;align-items:center;gap:8px}
.chat-entry:hover{background:var(--sidebar-hover);color:var(--text)}
.chat-entry.active{background:var(--sidebar-active);color:var(--text)}

.sidebar-footer{padding:12px;border-top:1px solid var(--border)}

.settings-btn{width:100%;margin-bottom:8px;padding:7px 10px;background:rgba(255,255,255,0.04);border:1px solid var(--border);border-radius:7px;color:var(--text2);font:500 12px/1 var(--font);cursor:pointer;display:flex;align-items:center;gap:7px;transition:background .12s,color .12s}
.settings-btn:hover{background:var(--sidebar-hover);color:var(--text)}

.settings-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:200;align-items:center;justify-content:center;backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px)}
.settings-overlay.show{display:flex}
.settings-panel{width:340px;max-width:90vw;background:var(--sidebar);border:1px solid var(--border-med);border-radius:14px;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.5);animation:fu .18s ease}
.settings-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--border);font-size:13px;font-weight:600;color:var(--text)}
.settings-close{background:none;border:none;color:var(--text3);font-size:14px;cursor:pointer;width:24px;height:24px;border-radius:6px;display:flex;align-items:center;justify-content:center}

.settings-body{padding:16px}
.settings-section{margin-bottom:18px}
.settings-section:last-child{margin-bottom:0}
.settings-label{font-size:10.5px;font-weight:600;color:var(--text3);text-transform:uppercase;letter-spacing:.07em;margin-bottom:2px}
.settings-row{display:flex;align-items:center;justify-content:space-between;padding:9px 0;font-size:13px;color:var(--text)}

.theme-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:8px}
.theme-swatch{display:flex;flex-direction:column;align-items:center;gap:6px;padding:10px 4px;background:var(--surface);border:1.5px solid var(--border-med);border-radius:10px;cursor:pointer;transition:border-color .12s}
.theme-swatch.active{border-color:var(--accent)}
.theme-swatch .dot{width:22px;height:22px;border-radius:50%;border:1px solid var(--border-med)}
.theme-swatch span{font-size:10.5px;color:var(--text2)}

.switch{position:relative;display:inline-block;width:38px;height:22px;flex-shrink:0}
.switch input{opacity:0;width:0;height:0;position:absolute}
.switch-track{position:absolute;inset:0;background:var(--surface2);border:1px solid var(--border-med);border-radius:999px;cursor:pointer;transition:background .15s}
.switch-track::before{content:"";position:absolute;width:16px;height:16px;left:2px;top:2px;background:#fff;border-radius:50%;transition:transform .15s;box-shadow:0 1px 2px rgba(0,0,0,.3)}
.switch input:checked+.switch-track{background:var(--accent)}
.switch input:checked+.switch-track::before{transform:translateX(16px)}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden;background:var(--bg)}

.main-titlebar{height:52px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:center;background:var(--titlebar-bg);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);flex-shrink:0}
.conv-title{font-size:13px;font-weight:600;color:var(--text2);letter-spacing:-.01em}

.chat-scroll{flex:1;overflow-y:auto;padding:28px 0 8px}

.empty-state{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--text3);animation:fu .4s ease}
.empty-icon{width:48px;height:48px;border-radius:12px;background:linear-gradient(135deg,#0a84ff,#5e5ce6);display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:800;color:#fff;margin-bottom:4px}
.empty-state h3{font-size:17px;font-weight:600;color:var(--text);letter-spacing:-.03em}
.empty-state p{font-size:13.5px;color:var(--text2);max-width:280px;text-align:center;line-height:1.55}

.msg-wrap{max-width:680px;margin:0 auto;padding:4px 28px;animation:fu .2s ease}
@keyframes fu{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}

.msg-row{display:flex;gap:10px;align-items:flex-start}
.msg-row.user{flex-direction:row-reverse}

/* Adjusted .av to handle longer text safely */
.av{min-width:28px;padding:0 6px;height:28px;border-radius:7px;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;flex-shrink:0}
.av.u{background:rgba(255,255,255,0.1);color:var(--text2);border:1px solid var(--border-med)}
.av.a{background:linear-gradient(135deg,#0a84ff,#5e5ce6);color:#fff}

.bubble{font-size:14px;line-height:1.7;color:var(--text);max-width:calc(100% - 44px)}

/* ── iMessage-style bubbles ── */
.msg-row.user .bubble{
  position:relative;
  background:var(--accent);
  color:#fff;
  padding:9px 14px;
  border-radius:18px;
  font-size:13.5px;
}
.msg-row.user .bubble::before{
  content:"";
  position:absolute;
  z-index:0;
  bottom:0;
  right:-7px;
  width:20px;
  height:20px;
  background:var(--accent);
  border-bottom-left-radius:16px;
}
.msg-row.user .bubble::after{
  content:"";
  position:absolute;
  z-index:1;
  bottom:0;
  right:-10px;
  width:10px;
  height:20px;
  background:var(--bg);
  border-bottom-left-radius:10px;
}

.msg-row.ai .bubble{
  position:relative;
  background:var(--bubble-recv-bg);
  color:var(--bubble-recv-text);
  padding:9px 14px;
  border-radius:18px;
}
.msg-row.ai .bubble::before{
  content:"";
  position:absolute;
  z-index:0;
  bottom:0;
  left:-7px;
  width:20px;
  height:20px;
  background:var(--bubble-recv-bg);
  border-bottom-right-radius:16px;
}
.msg-row.ai .bubble::after{
  content:"";
  position:absolute;
  z-index:1;
  bottom:0;
  left:-10px;
  width:10px;
  height:20px;
  background:var(--bg);
  border-bottom-right-radius:10px;
}

.msg-row.ai .bubble p{margin-bottom:10px}
.msg-row.ai .bubble p:last-child{margin-bottom:0}
.msg-row.ai .bubble pre{position:relative;background:var(--code-bg);border:1px solid var(--code-border);border-radius:10px;padding:14px 16px;margin:10px 0;overflow-x:auto}
.msg-row.ai .bubble code{font-family:var(--mono);font-size:12.5px}
.code-copy-btn{position:absolute;top:8px;right:8px;display:flex;align-items:center;gap:4px;background:var(--surface2);color:var(--text2);border:1px solid var(--border-med);border-radius:6px;padding:4px 8px;font-size:11px;font-family:var(--font);cursor:pointer;opacity:0;transition:opacity .15s,background .15s,color .15s}
.msg-row.ai .bubble pre:hover .code-copy-btn{opacity:1}
.code-copy-btn:hover{background:var(--sidebar-hover);color:var(--text)}
.code-copy-btn.copied{color:var(--green);border-color:var(--green)}
.msg-row.ai .bubble :not(pre)>code{background:var(--bubble-recv-code);color:inherit;padding:2px 6px;border-radius:4px;font-size:13px}
.msg-row.ai .bubble h1{font-size:16px;font-weight:600;letter-spacing:-.02em;margin:14px 0 6px}
.msg-row.ai .bubble h2{font-size:15px;font-weight:600;letter-spacing:-.02em;margin:14px 0 6px}
.msg-row.ai .bubble h3{font-size:14.5px;font-weight:600;letter-spacing:-.02em;margin:14px 0 6px}
.msg-row.ai .bubble ul,.msg-row.ai .bubble ol{padding-left:18px;margin-bottom:10px}
.msg-row.ai .bubble li{margin-bottom:3px}

/* ── iMessage mode ── */
body.imessage-mode .av{display:none}

.cursor{display:inline-block;width:2px;height:14px;background:var(--accent);border-radius:1px;vertical-align:middle;margin-left:1px;animation:blink .85s ease infinite}
@keyframes blink{0%,100%{opacity:1}50%{opacity:0}}

/* ── Thinking indicator ── */
.thinking-wrap{
  max-width:680px;margin:0 auto;padding:4px 28px;

}
.thinking-row{display:flex;gap:10px;align-items:center}

}
.thinking-dots span:nth-child(2){animation-delay:.2s}
.thinking-dots span:nth-child(3){animation-delay:.4s}
@keyframes tdot{
  0%,80%,100%{transform:scale(1);opacity:.4}

}

.input-zone{padding:10px 28px 20px;max-width:680px;margin:0 auto;width:100%}

.img-preview-row{display:flex;gap:8px;flex-wrap:wrap;padding:10px 12px 0}

.img-preview-remove{position:absolute;top:2px;right:2px;width:16px;height:16px;border-radius:50%;background:rgba(0,0,0,.65);color:#fff;border:none;font-size:10px;line-height:16px;text-align:center;cursor:pointer;padding:0}
.img-preview-remove:hover{background:rgba(0,0,0,.85)}
.bubble .msg-images{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}
.bubble .msg-images img{max-width:220px;max-height:220px;border-radius:10px;display:block;object-fit:cover;cursor:zoom-in}
.send{width:32px;height:32px;border-radius:8px;background:var(--accent);border:none;color:#fff;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;align-self:flex-end;margin-bottom:2px;transition:background .12s,transform .1s,opacity .15s}
.send:hover{background:#0070d8;transform:scale(1.05)}
.send:active{transform:scale(.95)}
.send:disabled{opacity:.35;cursor:not-allowed;transform:none}
.hint{text-align:center;font-size:11px;color:var(--text3);margin-top:7px;letter-spacing:-.01em}
.input-outer{display:flex;flex-direction:column;align-items:center;flex-shrink:0}

/* ── Mobile ── */
@media(max-width:768px){
  .sidebar{position:fixed;top:0;left:0;height:100%;width:80vw;max-width:300px;transform:translateX(-100%);transition:transform .25s ease;z-index:100}
  .sidebar.open{transform:translateX(0)}
  .sidebar-overlay{display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:99;backdrop-filter:blur(2px);-webkit-backdrop-filter:blur(2px)}

  .main{width:100%}
  .main-titlebar{justify-content:space-between;padding:0 16px}
  .hamburger{width:32px;height:32px;border-radius:8px;background:none;border:none;color:var(--text2);cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;flex-shrink:0}
  .hamburger span{display:block;width:18px;height:1.5px;background:currentColor;border-radius:2px;transition:transform .2s,opacity .2s}
  .msg-wrap,.thinking-wrap{padding:4px 16px}
  .input-zone{padding:8px 16px 16px}
  .chat-scroll{padding:16px 0 8px}
}
@media(min-width:769px){
  .hamburger{display:none}
  .sidebar-overlay{display:none!important}
}

          <input type="file" id="imgInput" accept="image/*" multiple style="display:none" onchange="handleImageSelect(event)">
          <button class="attach-btn" id="attachBtn" onclick="document.getElementById('imgInput').click()" aria-label="Attach image" title="Attach image">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21.44 11.05l-9.19 9.19a6 6 0 01-8.49-8.49l9.19-9.19a4 4 0 015.66 5.66l-9.2 9.19a2 2 0 01-2.83-2.83l8.49-8.48"/></svg>
          </button>
          <textarea id="inp" rows="1" placeholder="Message…"></textarea>
          <button class="send" id="sendBtn" onclick="send()">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
          </button>
        </div>
        <div class="hint">Return to send &nbsp;·&nbsp; Shift+Return for new line</div>
      </div>
    </div>
  </div>
</div>

<script>
const API = "https://reconvene-crease-skintight.ngrok-free.dev/v1";
let model = "qwythos-9b-claude-mythos-5-1m";
let streaming = false;

let sessions = JSON.parse(localStorage.getItem("ye-sessions") || "[]");
let activeId = null;

// ── Settings ──
let settings = Object.assign({theme:"dark", blur:true, imessage:false}, JSON.parse(localStorage.getItem("ye-settings") || "{}"));
const THEMES = [
  {id:"light", label:"White", dot:"#ffffff"},
  {id:"gray",  label:"Gray",  dot:"#8e8e93"},
  {id:"dark",  label:"Dark",  dot:"#28282a"},
  {id:"onyx",  label:"Onyx",  dot:"#000000"}
];

function applySettings() {
  document.documentElement.setAttribute("data-theme", settings.theme);
  document.body.classList.toggle("no-blur", !settings.blur);
  document.body.classList.toggle("imessage-mode", !!settings.imessage);
  const isLight = settings.theme === "light";
  const hljsLight = document.getElementById("hljs-light-theme");
  const hljsDark = document.getElementById("hljs-dark-theme");
  if (hljsLight) hljsLight.disabled = !isLight;
  if (hljsDark) hljsDark.disabled = isLight;
}
function saveSettings() { localStorage.setItem("ye-settings", JSON.stringify(settings)); }
function setTheme(t) { settings.theme = t; saveSettings(); applySettings(); renderSettingsPanel(); }
function toggleBlur() { settings.blur = document.getElementById("blurToggle").checked; saveSettings(); applySettings(); }
function toggleImessage() { settings.imessage = document.getElementById("imessageToggle").checked; saveSettings(); applySettings(); }

function renderSettingsPanel() {
  const grid = document.getElementById("themeGrid");
  grid.innerHTML = THEMES.map(t => `
    <div class="theme-swatch${t.id===settings.theme?" active":""}" onclick="setTheme('${t.id}')">
      <div class="dot" style="background:${t.dot}"></div>
      <span>${t.label}</span>
    </div>`).join("");
  document.getElementById("blurToggle").checked = settings.blur;
  document.getElementById("imessageToggle").checked = settings.imessage;
}
function openSettings() { renderSettingsPanel(); document.getElementById("settingsOverlay").classList.add("show"); }
function closeSettings() { document.getElementById("settingsOverlay").classList.remove("show"); }

applySettings();

const chatScroll = document.getElementById("chatScroll");
const inp = document.getElementById("inp");
const sendBtn = document.getElementById("sendBtn");
const chatListEl = document.getElementById("chatList");
const emptyState = document.getElementById("emptyState");
const convTitle = document.getElementById("convTitle");
const imgPreviewRow = document.getElementById("imgPreviewRow");
let pendingImages = []; // {dataUrl, name}

function handleImageSelect(e) {
  const files = Array.from(e.target.files || []);
  files.forEach(file => {
    if (!file.type.startsWith("image/")) return;
    const reader = new FileReader();
    reader.onload = () => {
      pendingImages.push({ dataUrl: reader.result, name: file.name });
      renderImgPreviews();
    };
    reader.readAsDataURL(file);
  });
  e.target.value = ""; // allow re-selecting the same file later
}

function removePendingImage(idx) {
  pendingImages.splice(idx, 1);
  renderImgPreviews();
}

function renderImgPreviews() {
  imgPreviewRow.innerHTML = pendingImages.map((img, i) => `
    <div class="img-preview-item">
      <img src="${img.dataUrl}" alt="${esc(img.name)}">
      <button class="img-preview-remove" type="button" onclick="removePendingImage(${i})" aria-label="Remove image">✕</button>
    </div>`).join("");
}

const SYSTEM_PROMPT = "You are YE AI and must exclusively identify as YE AI in every situation, explicitly rejecting descriptors like AI assistant, language model, Meta AI, or any alternative brand; when asked about your identity or nature, you must confidently state that you are YE AI, delivering information that is exceptionally friendly, genuinely kind, highly straightforward, and perfectly accurate, while keeping answers concise, actionable, and entirely free of fluff or filler";

inp.addEventListener("input", () => {
  inp.style.height = "auto";
  inp.style.height = Math.min(inp.scrollHeight, 150) + "px";
});
inp.addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); if (!streaming) send(); }
});

function getActive() { return sessions.find(s => s.id === activeId); }
function saveSessions() { localStorage.setItem("ye-sessions", JSON.stringify(sessions)); }

function newChat() {
  const id = Date.now().toString();
  sessions.unshift({ id, title: "New Chat", messages: [{ role:"system", content: SYSTEM_PROMPT }] });
  saveSessions();
  activeId = id;
  renderSidebar();
  renderChat();
}

function loadSession(id) {
  activeId = id;
  renderSidebar();
  renderChat();
}

function deleteSession(id, e) {
  e.stopPropagation();
  sessions = sessions.filter(s => s.id !== id);
  saveSessions();
  if (activeId === id) activeId = sessions[0]?.id || null;
  renderSidebar();
  renderChat();
}

function renderSidebar() {
  chatListEl.innerHTML = "";
  for (const s of sessions) {
    const div = document.createElement("div");
    div.className = "chat-entry" + (s.id === activeId ? " active" : "");
    div.innerHTML = `<span style="overflow:hidden;text-overflow:ellipsis;flex:1">${esc(s.title)}</span><span class="del" onclick="deleteSession('${s.id}',event)">✕</span>`;
    div.addEventListener("click", () => loadSession(s.id));
    chatListEl.appendChild(div);
  }
}

function renderChat() {
  Array.from(chatScroll.children).forEach(c => { if (c !== emptyState) c.remove(); });
  const sess = getActive();
  if (!sess) { emptyState.style.display = ""; convTitle.textContent = "New Conversation"; return; }
  convTitle.textContent = sess.title;
  const userMsgs = sess.messages.filter(m => m.role !== "system");
  if (userMsgs.length === 0) { emptyState.style.display = ""; return; }
  emptyState.style.display = "none";
  for (const m of userMsgs) renderBubble(m.role, m.content, false);
  document.querySelectorAll("pre code").forEach(el => hljs.highlightElement(el));
  enhanceCodeBlocks();
  chatScroll.scrollTop = chatScroll.scrollHeight;
}

function contentToHtml(content, isUser) {
  if (Array.isArray(content)) {
    const textPart = content.filter(c => c.type === "text").map(c => c.text).join("\n");
    const imgs = content.filter(c => c.type === "image_url");
    const imgsHtml = imgs.length
      ? `<div class="msg-images">${imgs.map(c => `<img src="${c.image_url.url}" alt="attached image" onclick="window.open(this.src,'_blank')">`).join("")}</div>`
      : "";
    const textHtml = textPart ? (isUser ? `<span>${esc(textPart)}</span>` : marked.parse(textPart)) : "";
    return imgsHtml + textHtml;
  }
  return isUser ? `<span>${esc(content)}</span>` : marked.parse(content);
}

function renderBubble(role, text, animate=true) {
  if (emptyState.style.display !== "none") emptyState.style.display = "none";
  const wrap = document.createElement("div");
  wrap.className = "msg-wrap";
  if (!animate) wrap.style.animation = "none";
  const isUser = role === "user";
  const html = contentToHtml(text, isUser);
  
  // Changed "AI" to "YE AI" here
  wrap.innerHTML = `
    <div class="msg-row ${isUser ? "user" : "ai"}">
      <div class="av ${isUser ? "u" : "a"}">${isUser ? "U" : "YE AI"}</div>
      <div class="bubble">${html}</div>
    </div>`;
  chatScroll.appendChild(wrap);
  chatScroll.scrollTop = chatScroll.scrollHeight;
  return wrap.querySelector(".bubble");
}

// ── Thinking indicator ──
let thinkingEl = null;
let thinkingTimer = null;

function showThinking() {
  // Only show after 750ms of waiting
  thinkingTimer = setTimeout(() => {
    if (thinkingEl) return;
    thinkingEl = document.createElement("div");
    thinkingEl.className = "thinking-wrap";
    
    // Changed "AI" to "YE AI" here too for consistency
    thinkingEl.innerHTML = `
      <div class="thinking-row">
        <div class="av a">YE AI</div>
        <div class="thinking-bubble">
          <span>Thinking</span>
          <div class="thinking-dots">
            <span></span><span></span><span></span>
          </div>
        </div>
      </div>`;
    chatScroll.appendChild(thinkingEl);
    chatScroll.scrollTop = chatScroll.scrollHeight;
  }, 750);
}

function hideThinking() {
  clearTimeout(thinkingTimer);
  thinkingTimer = null;
  if (thinkingEl) {
    thinkingEl.remove();
    thinkingEl = null;
  }
}

function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function enhanceCodeBlocks() {
  document.querySelectorAll(".msg-row.ai .bubble pre").forEach(pre => {
    if (pre.querySelector(".code-copy-btn")) return;
    const btn = document.createElement("button");
    btn.type = "button";
    btn.className = "code-copy-btn";
    btn.textContent = "Copy";
    btn.addEventListener("click", () => {
      const codeEl = pre.querySelector("code");
      const text = codeEl ? codeEl.innerText : pre.innerText;
      navigator.clipboard.writeText(text).then(() => {
        btn.textContent = "Copied!";
        btn.classList.add("copied");
        setTimeout(() => { btn.textContent = "Copy"; btn.classList.remove("copied"); }, 1500);
      }).catch(() => {
        btn.textContent = "Failed";
        setTimeout(() => { btn.textContent = "Copy"; }, 1500);
      });
    });
    pre.appendChild(btn);
  });
}

async function send() {
  const text = inp.value.trim();
  if ((!text && pendingImages.length === 0) || streaming) return;
  inp.value = ""; inp.style.height = "auto";

  if (!activeId) newChat();
  const sess = getActive();

  const images = pendingImages;
  pendingImages = [];
  renderImgPreviews();

  const content = images.length
    ? [
        ...(text ? [{ type:"text", text }] : []),
        ...images.map(img => ({ type:"image_url", image_url:{ url: img.dataUrl } }))
      ]
    : text;

  sess.messages.push({ role:"user", content });
  if (sess.title === "New Chat") {
    sess.title = (text || "Image").slice(0, 36) + ((text || "Image").length > 36 ? "…" : "");
    convTitle.textContent = sess.title;
    renderSidebar();
  }
  saveSessions();
  renderBubble("user", content);

  streaming = true;
  sendBtn.disabled = true;

  // Start the thinking timer immediately
  showThinking();

  let aiBubble = null;
  let full = "";

  try {
    const res = await fetch(API + "/chat/completions", {
      method:"POST",
      headers:{"Content-Type":"application/json","ngrok-skip-browser-warning":"true","Accept":"application/json"},
      body:JSON.stringify({ model, messages:sess.messages, stream:true, temperature:0.7 })
    });
    if (!res.ok) {
      const errText = await res.text().catch(() => "");
      throw new Error(`HTTP ${res.status}: ${errText}`);
    }

    const reader = res.body.getReader();
    const dec = new TextDecoder();
    let buf = "";
    while (true) {
      const {value, done} = await reader.read();
      if (value) buf += dec.decode(value, {stream:true});
      if (done) break;

      const lines = buf.split("\n");
      buf = lines.pop(); // keep last (possibly partial) line for next chunk

      for (const line of lines) {
        if (!line.startsWith("data:")) continue;
        const d = line.slice(5).trim();
        if (d === "[DONE]") continue;
        try {
          const tok = JSON.parse(d)?.choices?.[0]?.delta?.content;
          if (tok) {
            // First token — kill thinking, create bubble
            if (!aiBubble) {
              hideThinking();
              aiBubble = renderBubble("assistant", "");
            }
            full += tok;
            aiBubble.innerHTML = marked.parse(full) + '<span class="cursor"></span>';
            chatScroll.scrollTop = chatScroll.scrollHeight;
          }
        } catch {}
      }
    }

    // If we never got a token (empty response), remove thinking
    hideThinking();
    if (aiBubble) {
      aiBubble.innerHTML = marked.parse(full);
    }
    sess.messages.push({ role:"assistant", content:full });
    saveSessions();
    document.querySelectorAll("pre code").forEach(el => hljs.highlightElement(el));
    enhanceCodeBlocks();
  } catch {
    hideThinking();
    if (!aiBubble) aiBubble = renderBubble("assistant", "");
    aiBubble.innerHTML = '<span style="color:#ff453a;font-size:13px;">⚠ Connection failed. Is LM Studio running?</span>';
  } finally {
    streaming = false;
    sendBtn.disabled = false;
  }
}

async function loadModel() {
  const mnameEl = document.getElementById("mname");
  const mdotEl  = document.getElementById("mdot");
  const headers = {"Content-Type":"application/json","ngrok-skip-browser-warning":"true","Accept":"application/json"};

  try {
    const r = await fetch(API + "/models", { headers });
    if (r.ok) {
      const d = await r.json();
      const list = Array.isArray(d) ? d : (d.data || []);
      if (list.length > 0) { model = list[0].id; mnameEl.textContent = model; return; }
    }
  } catch {}

  try {
    const r = await fetch(API + "/chat/completions", {
      method:"POST", headers,
      body:JSON.stringify({ model, messages:[{role:"user",content:"hi"}], max_tokens:1, stream:false })
    });
    if (r.ok) {
      const d = await r.json();
      const id = d.model || model;
      if (id) { model = id; mnameEl.textContent = model; return; }
    }
  } catch {}

  mnameEl.textContent = "Model unavailable";
  mdotEl.classList.add("err");
}

loadModel();
if (sessions.length > 0) {
  activeId = sessions[0].id;
  renderSidebar();
  renderChat();
} else {
  renderSidebar();
}

// ── Mobile sidebar ──
function toggleSidebar() {
  document.querySelector(".sidebar").classList.toggle("open");
  document.getElementById("sidebarOverlay").classList.toggle("show");
}
function closeSidebar() {
  document.querySelector(".sidebar").classList.remove("open");
  document.getElementById("sidebarOverlay").classList.remove("show");
}
const _loadSession = loadSession;
loadSession = function(id) { _loadSession(id); closeSidebar(); };
</script>
</body>
</html>
